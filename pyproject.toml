
[project]
name = "tenancy-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "django-environ>=0.12,<1",
    "django-cors-headers>=4.7,<5",
    "django-filter>=25.1",
    "drf-spectacular>=0.28,<1",
    "dj-database-url",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "whitenoise>=6.8",
    "channels[daphne]>=4.2,<5",
    "channels-redis>=4.2,<5",
    "redis>=5.2",
    "django-redis>=5.4",
    "celery[redis]>=5.5,<6",
    "django-celery-beat>=2.8,<3",
    "gunicorn>=23",
    "uvicorn[standard]>=0.34",
    "uvicorn-worker>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "staticfiles", "media"]


[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF", "S"]
ignore = [
  "RUF012",  # mutable class attrs are idiomatic in Django Meta/admin classes
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake passwords are fine in tests
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501", "RUF"]
"config/settings/*.py" = ["S105"]
"apps/audit/services.py" = ["S105"]
# Operator scripts: talk to localhost, run the docker CLI, use the documented demo password.
"scripts/**" = ["S101", "S105", "S310", "S603", "S607"]  # action names like PASSWORD_RESET are not secrets

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
# Deprecations are errors: they're cheapest to fix the day they appear.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # Third-party: daphne (imported by channels.testing) sets a Windows event-loop policy
  # that Python 3.14 deprecates. Harmless on Linux/CI; remove once daphne is updated.
  "ignore::DeprecationWarning:daphne",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90  # CI gate
