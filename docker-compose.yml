# Full PLEET stack:
#
#   docker compose up --build -d
#   docker compose exec web python manage.py seed_data --force
#   docker compose --profile proxy up -d nginx     # optional reverse proxy on :8080
#
# Redis runs as a Sentinel-managed group (1 primary, 2 replicas, 3 sentinels, quorum 2), so
# losing any single Redis container triggers an automatic failover instead of an outage.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (50+ chars) in .env}
  ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://${POSTGRES_USER:-pleet}:${POSTGRES_PASSWORD:-pleet_dev_password}@postgres:5432/${POSTGRES_DB:-pleet}
  REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
  REDIS_MASTER_NAME: pleet-core
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://tenancy-fe.vercel.app}
  # This compose file serves plain HTTP locally; real deployments terminate TLS in front.
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "0"
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  LOG_FORMAT: json

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: pleet-backend:local
  environment: *app-env
  restart: unless-stopped
  networks: [default, redis]
  depends_on: &app-deps
    postgres:
      condition: service_healthy
    sentinel-1:
      condition: service_started
    sentinel-2:
      condition: service_started
    sentinel-3:
      condition: service_started

# Redis nodes and sentinels use FIXED IPs on their own network, and Sentinel monitors IPs,
# not hostnames. When a container stops, Docker's DNS drops its name. A sentinel
# monitoring by hostname then stalls on failed lookups, enters TILT mode and suspends
# failover (found by the failover drill). An IP that stops answering is the clean "down"
# signal Sentinel expects. Clients still find the sentinels by name.
x-redis-node: &redis-node
  image: redis:7.4-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

x-sentinel: &sentinel
  image: redis:7.4-alpine
  restart: unless-stopped
  entrypoint: ["sh", "/usr/local/bin/sentinel-entrypoint.sh"]
  depends_on:
    redis-primary:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pleet}
      POSTGRES_USER: ${POSTGRES_USER:-pleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pleet_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Redis HA: every node gets the same eviction policy because any replica may be
  # promoted. volatile-lru evicts only keys with a TTL (cache entries), never the Celery
  # broker or channel-layer keys. AOF everysec bounds data loss to about one second.
  redis-primary:
    <<: *redis-node
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy volatile-lru
    networks: {redis: {ipv4_address: 172.28.0.10}}
    volumes: [redis-primary:/data]

  redis-replica-1:
    <<: *redis-node
    command: >
      redis-server --replicaof 172.28.0.10 6379 --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy volatile-lru
    depends_on: {redis-primary: {condition: service_healthy}}
    networks: {redis: {ipv4_address: 172.28.0.11}}
    volumes: [redis-replica-1:/data]

  redis-replica-2:
    <<: *redis-node
    command: >
      redis-server --replicaof 172.28.0.10 6379 --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy volatile-lru
    depends_on: {redis-primary: {condition: service_healthy}}
    networks: {redis: {ipv4_address: 172.28.0.12}}
    volumes: [redis-replica-2:/data]

  sentinel-1:
    <<: *sentinel
    networks: {redis: {ipv4_address: 172.28.0.21}}
    environment: &sentinel-env
      SENTINEL_ANNOUNCE_HOST: 172.28.0.21
      REDIS_PRIMARY_HOST: 172.28.0.10
      REDIS_MASTER_NAME: pleet-core
      SENTINEL_QUORUM: "2"
    volumes:
      - ./docker/redis/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - sentinel-1:/data

  sentinel-2:
    <<: *sentinel
    environment:
      <<: *sentinel-env
      SENTINEL_ANNOUNCE_HOST: 172.28.0.22
    networks: {redis: {ipv4_address: 172.28.0.22}}
    volumes:
      - ./docker/redis/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - sentinel-2:/data

  sentinel-3:
    <<: *sentinel
    environment:
      <<: *sentinel-env
      SENTINEL_ANNOUNCE_HOST: 172.28.0.23
    networks: {redis: {ipv4_address: 172.28.0.23}}
    volumes:
      - ./docker/redis/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - sentinel-3:/data

  # --- Application ---------------------------------------------------------------------
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck: {disable: true}
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully

  # Exactly one beat: two would enqueue every scheduled job twice. (Jobs are idempotent,
  # so a duplicate would be harmless, but wasteful.)
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    healthcheck: {disable: true}
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    ports: ["8080:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web]

networks:
  default: {}
  redis:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  redis-primary:
  redis-replica-1:
  redis-replica-2:
  sentinel-1:
  sentinel-2:
  sentinel-3:
