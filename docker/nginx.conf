# Optional reverse proxy (docker compose --profile proxy up). In production TLS terminates
# here or at a cloud load balancer in front of it.
upstream pleet_web {
    server web:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;  # matches Django's upload limits; reject bigger bodies early
    server_tokens off;

    # WebSockets: upgrade the connection and keep it open for long-lived chats.
    location /ws/ {
        proxy_pass http://pleet_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://pleet_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
