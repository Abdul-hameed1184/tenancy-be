name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pleet
          POSTGRES_USER: pleet
          POSTGRES_PASSWORD: pleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pleet -d pleet"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://pleet:pleet@localhost:5432/pleet
      SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
      PLEET_TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file schema.yml

      - name: Tests with coverage (gate in pyproject.toml)
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Production settings pass Django's deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: api.example.com
          SECRET_KEY: ci-deploy-check-only-ci-deploy-check-only-ci-deploy-check-only
        run: python manage.py check --deploy --fail-level WARNING

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-schema
          path: |
            coverage.xml
            schema.yml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t pleet-backend:ci .
